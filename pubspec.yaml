name: peekless
description: Offline privacy auditor for the apps installed on your phone.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#00685A"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
